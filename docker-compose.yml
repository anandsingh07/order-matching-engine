# The whole exchange: gateway (durable, on a volume), bots, and the trading terminal.
#   docker compose up --build        then open http://localhost:3000
# BOTS_ARGS="--binance" docker compose up   to follow the live Binance BTC/USDT feed.

services:
  gateway:
    build: { context: ., target: gateway }
    init: true
    ports: ["8080:8080"]
    environment:
      WORKERS: "2"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      BOT_KEY: ${BOT_KEY:-local-dev-bot-key}
      ADMIN_KEY: ${ADMIN_KEY:-local-dev-admin-key}
      SURVEILLANCE_SHADOW_MS: ${SURVEILLANCE_SHADOW_MS:-0}
    volumes: ["exchange-data:/data"]
    restart: unless-stopped

  bots:
    build: { context: ., target: bots }
    init: true
    command: ${BOTS_ARGS:-}
    environment:
      BOT_KEY: ${BOT_KEY:-local-dev-bot-key}
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

  terminal:
    build:
      context: .
      target: terminal
      args: { NEXT_PUBLIC_GATEWAY_URL: "http://localhost:8080" }
    init: true
    ports: ["3000:3000"]
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

volumes:
  exchange-data:
