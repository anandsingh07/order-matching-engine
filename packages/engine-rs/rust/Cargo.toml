[package]
name = "ome-engine"
version = "0.1.0"
edition = "2024"
publish = false
description = "The @ome/core matching engine, ported to Rust and compiled to WebAssembly"

# No dependencies on purpose: no build scripts or proc-macros to run on the
# host, and nothing to link but the wasm itself (rust-lld does that).
[dependencies]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
